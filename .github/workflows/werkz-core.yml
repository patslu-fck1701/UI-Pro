name: WerkZ Core CI

on:
  push:
    branches: [main, "codex/**", "test/mobile-assistant-render"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: werkz-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts
      - name: Verify full core
        if: github.ref != 'refs/heads/test/mobile-assistant-render'
        run: npm run verify
      - name: Verify outbound worker Ed25519 contract (synthetic)
        if: github.ref != 'refs/heads/test/mobile-assistant-render'
        run: node --test apps/local-ai/tests/outbound_bridge_contract.node.test.cjs
      - name: Schrotties · Backend syntax
        if: github.ref == 'refs/heads/test/mobile-assistant-render'
        run: |
          node --check src/pilot/index.js
          node --check tools/time-test-server.js
          node --check src/pilot/mail-access.js
          node --check src/pilot/twilio-voice.js
          node --check src/pilot/storage-readiness.js
          node --check src/pilot/outbound-mail.js
      - name: Schrotties · Voice, login and tenant isolation
        if: github.ref == 'refs/heads/test/mobile-assistant-render'
        run: node --test test/pilot-voice-regression.test.js test/pilot-login-regression.test.js
      - name: Schrotties · Read-only mailbox and tenant isolation
        if: github.ref == 'refs/heads/test/mobile-assistant-render'
        run: node --test test/pilot-mail-access.test.js
      - name: Schrotties · Provider readiness (Twilio + storage + outbound mail)
        if: github.ref == 'refs/heads/test/mobile-assistant-render'
        run: node --test test/pilot-twilio-voice.test.js test/pilot-storage-readiness.test.js test/pilot-outbound-mail.test.js
      - name: Schrotties · Live prices and weigh-slip recalculation
        if: github.ref == 'refs/heads/test/mobile-assistant-render'
        run: node --test test/pilot-price-diagnostics.test.js
      - name: Schrotties · Mobile PWA (iPhone + Android) + local-first orders
        if: github.ref == 'refs/heads/test/mobile-assistant-render'
        run: node --test test/simple-pilot-ui.test.js test/pilot-local-runtime.test.js
      - name: Schrotties · Core regression gate (Maps + address + logout + orders + delete)
        if: github.ref == 'refs/heads/test/mobile-assistant-render'
        run: node --test test/pilot-voice-regression.test.js test/pilot-login-regression.test.js test/pilot-local-runtime.test.js test/simple-pilot-ui.test.js
      - name: Schrotties · Failure diagnosis
        if: failure() && github.ref == 'refs/heads/test/mobile-assistant-render'
        run: |
          echo "::error title=Schrotties CI failed::Check the first failed Schrotties step above: backend syntax, voice/login/tenant, live prices/weigh-slip, mobile PWA/local-first storage, or core regressions (Maps/address/logout/orders/delete/route-connect)."
          echo "Render deployment should not be treated as verified until these checks are green."

  hotel-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/local-ai
    env:
      WERKZ_AI_PACKAGE: hotel
      WERKZ_AI_MODE: production
      WERKZ_AI_DATA: /tmp/werkz-hotel-ci
      WERKZ_HOTEL_OPENAI_ENABLED: "0"
      WERKZ_ONLINE_TEST: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/local-ai/requirements.txt
      - name: Install Hotel backend test dependencies
        run: python -m pip install -e ".[test,hotel,business]"
      - name: Hotel backend and security regression suite
        run: python -m pytest -q
      - name: Hotel online configuration preflight (synthetic only, no secrets)
        run: python scripts/hotel_online_preflight.py --ci-synthetic
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/local-ai/frontend/package-lock.json
      - name: Synthetic inbound Qwen gateway contract
        run: node --test tests/bridge-protocol.test.cjs
      - name: Install Hotel frontend dependencies
        working-directory: apps/local-ai/frontend
        run: npm ci --ignore-scripts
      - name: Hotel TypeScript and production build
        working-directory: apps/local-ai/frontend
        run: npm run build
      - name: Install synthetic Hotel browser runtime
        working-directory: apps/local-ai/frontend
        run: npx playwright install --with-deps chromium
      - name: Hotel provider UI release-candidate smoke (synthetic only)
        env:
          WERKZ_TEST_PYTHON: python
        run: node tests/browser_hotel_ai_providers.mjs

  hotel-postgres-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/local-ai
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotel_ci
          POSTGRES_USER: hotel_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_ci -d hotel_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WERKZ_AI_PACKAGE: hotel
      WERKZ_AI_MODE: production
      WERKZ_AI_DATA: /tmp/werkz-hotel-postgres-ci
      WERKZ_HOTEL_POSTGRES_ENABLED: "1"
      WERKZ_HOTEL_DB_SCHEMA: werkz_hotel_test
      WERKZ_HOTEL_DATABASE_URL: postgresql://hotel_ci:synthetic-ci-only@127.0.0.1:5432/hotel_ci
      WERKZ_HOTEL_OPENAI_ENABLED: "0"
      WERKZ_ONLINE_TEST: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/local-ai/requirements.txt
      - name: Install isolated Hotel PostgreSQL test dependencies
        run: python -m pip install -e ".[test,hotel]"
      - name: Prove isolated schema, migrations, booking rollback and cross-process persistence
        run: python tests/postgres_hotel_smoke.py
