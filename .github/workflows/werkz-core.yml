name: WerkZ Core CI

on:
  push:
    branches: [main, "codex/**", "test/mobile-assistant-render"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts
      - name: Verify full core
        if: github.ref != 'refs/heads/test/mobile-assistant-render'
        run: npm run verify
      - name: Verify Schrotties Render mirror
        if: github.ref == 'refs/heads/test/mobile-assistant-render'
        run: |
          node --check src/pilot/index.js
          node --check tools/time-test-server.js
          node --test test/pilot-simple.test.js
