<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WerkZ Einfach</title><style>
:root{color-scheme:dark;--bg:#050806;--panel:#0a120d;--line:#203829;--g:#39e875;--txt:#eef7f0;--muted:#91a898}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(57,232,117,.12),transparent 32%),var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif}main{max-width:1000px;margin:auto;padding:18px 14px 36px}header{display:flex;justify-content:space-between;gap:12px;align-items:start}.brand{font-weight:900;letter-spacing:.12em}.brand b{color:var(--g)}h1{font-size:clamp(2.4rem,9vw,4.5rem);line-height:.95;margin:.4rem 0}header p,.foot,.item small{color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.action{border:1px solid #285a38;border-radius:17px;background:#09150d;color:var(--txt);min-height:132px;padding:15px;text-align:left;display:flex;flex-direction:column;gap:7px;cursor:pointer}.action b{font-size:1.7rem}.action span{font-weight:900}.action small{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}.card{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:14px;min-height:165px}.head{display:flex;justify-content:space-between;gap:8px;font-weight:800;margin-bottom:10px}.head button,.badge{border:1px solid #285a38;background:#07100a;color:var(--txt);border-radius:9px;padding:5px 8px}.badge{font-size:.72rem;color:var(--g)}.list{display:grid;gap:7px}.item{border:1px solid #192d20;border-radius:10px;padding:9px;background:#07100a}.item b{display:block}.price{font-size:1.7rem;font-weight:900;color:var(--g);margin:.45rem 0}.foot{text-align:center;font-size:.75rem;margin-top:18px}@media(max-width:700px){.actions{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.action{min-height:115px}}
</style></head><body><main><header><div><div class="brand">WERK<b>Z</b> · PILOT</div><h1>Einfach arbeiten.</h1><p id="status">Lade Übersicht …</p></div><div style="display:grid;gap:8px;text-align:right"><a href="/pilot/site/" style="color:#39e875">Kunden-Website</a><a href="/hub/" style="color:#91a898">WerkZ</a></div></header>
<section class="actions"><button class="action" id="callsBtn"><b>📞</b><span>Anrufe</span><small id="callsCount">–</small></button><label class="action"><b>📷</b><span>Beleg fotografieren</span><small>Rechnung · Bon · Wiegeschein</small><input id="photo" hidden type="file" accept="image/*,application/pdf" capture="environment"></label><button class="action" id="noteBtn"><b>🎙</b><span>Sprechen / Notiz</span><small>Einfach sagen</small></button><button class="action" id="sendBtn"><b>📤</b><span>Monat senden</span><small>Steuerberater-Paket</small></button></section>
<section class="grid"><article class="card"><div class="head"><span>Rückrufe</span><button id="demoCall">Demo-Anruf</button></div><div id="calls" class="list">Noch keine Rückrufe.</div></article><article class="card"><div class="head"><span>Wichtige E-Mails</span><button id="mailRefresh">Neu laden</button></div><div id="mail" class="list">Wird geladen …</div></article><article class="card"><div class="head"><span>Belege</span><span id="docCount" class="badge">0</span></div><div id="docs" class="list">Noch keine Belege.</div></article><article class="card"><div class="head"><span>Bitcoin / Markt</span><span class="badge">Nur Ansicht</span></div><div id="market">Wird geladen …</div></article></section><p class="foot">WerkZ Pilot · bewusst einfach · keine automatische Preis- oder Handelsentscheidung</p></main>
<script>
'use strict';var q=function(s){return document.querySelector(s)};function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}async function api(p,o){o=o||{};var r=await fetch('/pilot/api'+p,Object.assign({},o,{headers:Object.assign({'content-type':'application/json'},o.headers||{})}));if(r.status===401){location.href='/test-login?return='+encodeURIComponent('/pilot/');throw Error('login')}var d=await r.json().catch(function(){return {}});if(!r.ok)throw Error(d.error||'Fehler');return d}function euro(v){return Number.isFinite(Number(v))?Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR'}):'–'}async function refresh(){var a=await Promise.all([api('/summary'),api('/calls'),api('/documents')]),s=a[0],calls=a[1],docs=a[2];q('#status').textContent=s.open?s.open+' Dinge offen':'Alles im Blick';q('#callsCount').textContent=s.callbacks+' Rückrufe';q('#docCount').textContent=docs.length;q('#calls').innerHTML=calls.length?calls.slice(0,5).map(function(x){return '<div class="item"><b>'+esc(x.name)+' · '+esc(x.category||'Rückruf')+'</b><small>'+esc(x.topic)+(x.phone?' · '+esc(x.phone):'')+'</small></div>'}).join(''):'Noch keine Rückrufe.';q('#docs').innerHTML=docs.length?docs.slice(0,5).map(function(x){return '<div class="item"><b>'+esc(x.type)+'</b><small>'+esc(x.storage&&x.storage.fileName||'Datei')+'</small></div>'}).join(''):'Noch keine Belege.'}async function mail(){try{var rows=await api('/mail');q('#mail').innerHTML=rows.length?rows.map(function(x){return '<div class="item"><b>'+esc(x.category)+' · '+esc(x.subject)+'</b><small>'+esc(x.from)+' · '+esc(x.snippet)+'</small></div>'}).join(''):'Keine wichtigen E-Mails.'}catch(e){q('#mail').textContent='E-Mail-Verbindung noch nicht eingerichtet.'}}async function market(){try{var x=await api('/market'),m=x.market||{},p=x.portfolio||{};q('#market').innerHTML='<b>Demo-Portfolio · Nur Ansicht</b><div class="price">'+(m.price!=null?euro(m.price):'Live-Verbindung vorbereitet')+'</div><small>BTC: '+(p.quantity!=null?esc(p.quantity):'–')+' · Marktwert: '+euro(p.marketValueEur)+'</small><p>'+esc(m.note||p.note||'')+'</p>'}catch(e){q('#market').textContent='Crypto-Demo noch nicht verbunden.'}}q('#demoCall').onclick=async function(){await api('/calls',{method:'POST',body:JSON.stringify({providerPayload:{name:'Beispielkunde',topic:'Metall abholen',location:'Alfeld',material:'Mischschrott',quantity:'ca. 1 t'}})});refresh()};q('#callsBtn').onclick=function(){q('#calls').scrollIntoView({behavior:'smooth'})};q('#mailRefresh').onclick=mail;q('#photo').onchange=async function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var b=new Uint8Array(await f.arrayBuffer()),s='';for(var i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));await api('/documents',{method:'POST',body:JSON.stringify({fileName:f.name,mime:f.type||'application/octet-stream',dataBase64:btoa(s)})});e.target.value='';refresh()};q('#noteBtn').onclick=function(){var S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){var t=prompt('Notiz eingeben');if(t)api('/notes',{method:'POST',body:JSON.stringify({text:t})});return}var r=new S();r.lang='de-DE';r.onresult=function(e){var t=e.results[0][0].transcript;api('/notes',{method:'POST',body:JSON.stringify({text:t})})};r.start()};q('#sendBtn').onclick=async function(){var d=new Date(),m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),p=await api('/export/prepare',{method:'POST',body:JSON.stringify({month:m})});if(!confirm(p.count+' Belege für '+m+' an Steuerberater übergeben?'))return;var s=await api('/export/send',{method:'POST',body:JSON.stringify({exportId:p.id,confirm:true})});alert(s.delivery&&s.delivery.accepted?'Versand angestoßen.':'Demo: Paket vorbereitet, noch nicht extern versendet.')};Promise.allSettled([refresh(),mail(),market()]);
</script></body></html>
