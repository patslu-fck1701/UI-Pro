[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "werkz-ai-core"
version = "0.1.0"
description = "Local WERKZ AI Core with optional customer modules"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2,<3", "httpx>=0.28,<1", "python-multipart>=0.0.20", "defusedxml>=0.7,<1", "alembic>=1.20,<2", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
business = ["pandas==3.0.1", "numpy==2.3.5", "openpyxl>=3.1,<4", "pypdf>=5,<7", "reportlab>=4,<5"]
test = ["pytest>=8,<10"]
hotel = ["qrcode>=8,<9", "cryptography>=43,<49"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
